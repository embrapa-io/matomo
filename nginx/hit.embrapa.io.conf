# vhost do Matomo (hit.embrapa.io) no Nginx da VM — authorization server OAuth.
# Versão com melhorias aplicadas; comentários "# MELHORIA" / "# REMOVIDO"
# explicam cada mudança em relação à config original.

server {
  listen 80;
  listen [::]:80;
  server_name hit.embrapa.io;

  # MELHORIA: preservar caminho + query no redirect.
  # Antes: "return 301 https://hit.embrapa.io;" descartava o URI (todo request
  # HTTP caía na raiz). Importante para callbacks/links profundos.
  return 301 https://$host$request_uri;
}

server {
  # MELHORIA: sintaxe atual do HTTP/2 (antes "listen ... ssl http2" — depreciado
  # no nginx >= 1.25.1).
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;

  server_name hit.embrapa.io;

  ssl_certificate /etc/letsencrypt/live/hit.embrapa.io/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/hit.embrapa.io/privkey.pem;
  ssl_trusted_certificate /etc/letsencrypt/live/hit.embrapa.io/fullchain.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  # MELHORIA (segurança): HSTS. Opcional, mas recomendado p/ host só-HTTPS.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # MELHORIA: imports/uploads e payloads de API do Matomo podem exceder o
  # default de 1m. Alinha com max-allowed-packet=64MB do MariaDB.
  client_max_body_size 64m;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # REMOVIDO: "proxy_set_header Access-Control-Allow-Origin/Methods" — esses
    # cabeçalhos iam para o BACKEND (request), não para o cliente (response),
    # então não produziam efeito de CORS. O Matomo já trata CORS da sua API.
    # Se um dia precisar de CORS no proxy, use "add_header ... always".

    # REMOVIDO: "resolver 127.0.0.1" e "proxy_ssl_session_reuse off" — sem efeito
    # para upstream http estático (resolver só é necessário com proxy_pass por
    # variável/hostname dinâmico; proxy_ssl_* só vale para upstream https).

    # REMOVIDO: headers de WebSocket (Upgrade/Connection) — o Matomo não usa
    # WebSocket; a forma original forçava "Connection: upgrade" em todo request.

    # MELHORIA: IP explícito (evita ambiguidade de "localhost" -> ::1 x 127.0.0.1).
    proxy_pass http://127.0.0.1:8081;
  }
}
