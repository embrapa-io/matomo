# Repassa o cabeçalho "Authorization" ao PHP/Matomo.
#
# Com Apache + mod_php, o header "Authorization: Bearer ..." normalmente NÃO é
# exposto em $_SERVER['HTTP_AUTHORIZATION'], fazendo o McpServer recusar tokens
# OAuth/Bearer com 401 "Authentication required" — mesmo válidos.
#
# Prova observada: o MESMO token via query (?token_auth=) é aceito (chega a
# verificar privilégio), mas via "Authorization: Bearer" retorna 401, porque o
# header não chega à lógica de autenticação.
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteCond %{HTTP:Authorization} .
    RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
</IfModule>

<IfModule mod_setenvif.c>
    SetEnvIfNoCase ^Authorization$ "(.+)" HTTP_AUTHORIZATION=$1
</IfModule>
