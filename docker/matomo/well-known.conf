# Publica os metadados de descoberta OAuth 2.0 do Matomo nos caminhos padrão
# exigidos por clientes MCP (Claude, ChatGPT, Cursor):
#   - RFC 8414: /.well-known/oauth-authorization-server
#   - RFC 9728: /.well-known/oauth-protected-resource
#
# O plugin OAuth2 do Matomo expõe os endpoints em formato query-string
# (index.php?module=OAuth2&action=...) e NÃO publica esses metadados, então os
# clientes "chutam" /authorize na raiz e recebem 404. Aqui apontamos os
# documentos estáticos para os endpoints reais.
#
# Os arquivos ficam em /opt/well-known (fora de /var/www/html) para não serem
# mascarados pelo volume nomeado montado no docroot.

Alias "/.well-known/oauth-authorization-server" "/opt/well-known/oauth-authorization-server"
Alias "/.well-known/oauth-protected-resource"   "/opt/well-known/oauth-protected-resource"

<Directory "/opt/well-known">
    Require all granted
</Directory>

<LocationMatch "^/\.well-known/oauth-(authorization-server|protected-resource)$">
    ForceType application/json
    # CORS: o Claude Web (claude.ai) busca os metadados cross-origin
    Header always set Access-Control-Allow-Origin "*"
    Header always set Access-Control-Allow-Methods "GET, OPTIONS"
    Header always set Access-Control-Allow-Headers "Authorization, Content-Type"
</LocationMatch>
